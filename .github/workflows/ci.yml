name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prime-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: npm ci

      - name: Install hardhat dependencies
        run: |
          cd hardhat
          npm ci

      - name: Prime canonical compile/test/size/smoke
        run: npm run test:prime:ci

      - name: UI smoke test
        run: npm run test:ui

  becoming-genesis-556-snapshot:
    if: github.head_ref == 'chatgpt/becoming-genesis-556-snapshot-20260816'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated snapshot branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Harden legacy-endpoint handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/becoming-snapshot.mjs')
          s = p.read_text()
          s = s.replace('async function paginate(url) {', 'async function paginate(url, allow404 = false) {')
          s = s.replace('const payload = await fetchJson(fingerprint);', 'const payload = await fetchJson(fingerprint, {}, allow404);\n    if (payload === null) return items;')
          s = s.replace('const holders = await paginate(holdersUrl);', 'const holders = await paginate(holdersUrl, true);')
          s = s.replace('const transfers = await paginate(url);', 'const transfers = await paginate(url, true);')
          s = s.replace('unresolved_tokens: audit.filter(row => row.status !== "FAIL")', 'unresolved_tokens: audit.filter(row => row.status !== "PASS")')
          p.write_text(s)
          PY
          node --check scripts/becoming-snapshot.mjs

      - name: Collect and verify all 556 holdings at one Ethereum block
        env:
          SNAPSHOT_OUT: snapshot_output
          SNAPSHOT_WORKERS: '6'
          SNAPSHOT_HTTP_RETRIES: '8'
          SNAPSHOT_HTTP_TIMEOUT_MS: '45000'
          SNAPSHOT_BALANCE_BATCH_SIZE: '80'
        run: node scripts/becoming-snapshot.mjs

      - name: Upload complete snapshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: montrealai-becoming-genesis-556-atomic-snapshot
          path: snapshot_output
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
